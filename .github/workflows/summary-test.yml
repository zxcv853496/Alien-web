name: Job Summary Test

on:
  workflow_dispatch: # 允許在 GitHub Actions 頁面手動觸發

jobs:
  demo-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Markdown Summary 📝
        run: |
          echo "# 📊 測試報告 (Test Report)" >> $GITHUB_STEP_SUMMARY
          echo "這是一個由 GitHub Actions 產生的 **Job Summary** 範例。" >> $GITHUB_STEP_SUMMARY
          echo "你可以在每次 Action 執行完畢後的 Summary 頁面最下方看到這個區塊。" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 1. 狀態檢查" >> $GITHUB_STEP_SUMMARY
          echo "| 檢查項目 | 結果 | 備註 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 編譯 (Build) | ✅ 通過 | 無錯誤 |" >> $GITHUB_STEP_SUMMARY
          echo "| 測試 (Test) | ⚠️ 警告 | 發現 2 個非關鍵問題 |" >> $GITHUB_STEP_SUMMARY
          echo "| 部署 (Deploy) | ❌ 失敗 | 模擬失敗狀況 |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 2. 系統資訊" >> $GITHUB_STEP_SUMMARY
          echo "- **執行環境**: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Node 版本**: $(node -v)" >> $GITHUB_STEP_SUMMARY
          echo "- **觸發者**: $GITHUB_ACTOR" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> 這個功能非常適合用來顯示測試覆蓋率報告、部署網址或自訂的錯誤訊息。" >> $GITHUB_STEP_SUMMARY
