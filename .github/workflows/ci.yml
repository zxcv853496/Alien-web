name: CI Checks

# 設定觸發條件
on:
  push:
    branches: [ "develop" ] # 當推送到 develop 分支時觸發
  pull_request:
    branches: [ "main", "develop" ] # 當有人發起合併請求到 main 或 develop 時觸發

# 定義工作內容
jobs:
  check-quality:
    name: Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      # 1. 下載程式碼
      - name: Checkout Code 🗄️
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安裝依賴套件
      - name: Install Dependencies 📦
        # 使用與 deploy.yml 一致的參數，避開 React 19 相容性問題
        run: npm ci --legacy-peer-deps

      # 4. 程式碼品質檢查 (Lint)
      - name: Lint Check 🔍
        run: npm run lint

      # 5. 單元測試 (Unit Test)
      - name: Test Check 🧪
        run: npm run test

      # 6. 打包測試 (Build)
      - name: Build Check 🏗️
        run: npm run build

      - name: Generate CI Summary 📋
        if: always()
        run: |
          # Calculate Metrics
          if [ -d "dist" ]; then
            BUILD_SIZE=$(du -sh dist | cut -f1)
            FILE_COUNT=$(find dist -type f | wc -l)
          else
            BUILD_SIZE="N/A"
            FILE_COUNT="N/A"
          fi
          
          COMMIT_MSG=$(git log -1 --pretty=%B)
          BUILD_DATE=$(date "+%Y-%m-%d %H:%M:%S")
          
          # Check Job Status
          if [ "${{ job.status }}" == "success" ]; then
             echo "# 🟢 建置成功 (Build Success)" >> $GITHUB_STEP_SUMMARY
             STATUS_ICON="✅"
          else
             echo "# 🔴 建置失敗 (Build Failed)" >> $GITHUB_STEP_SUMMARY
             STATUS_ICON="❌"
          fi
          
          # Determine Report Type (Release vs Review vs Dev)
          if [ "${{ github.ref }}" == "refs/heads/develop" ] && [ "${{ github.event_name }}" == "push" ]; then
            REPORT_TYPE="新功能發布 (Feature Release)"
            CONTENT="$COMMIT_MSG"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            REPORT_TYPE="⏳ 功能審核 (Feature Review)"
            CONTENT="${{ github.event.pull_request.title }}"
          else
            REPORT_TYPE="📝 開發提交 (Dev Commit)"
            CONTENT="$COMMIT_MSG"
          fi

          echo "## 📋 $REPORT_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 內容 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **負責人員 (Actor)** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **主要內容 (Content)** | $CONTENT |" >> $GITHUB_STEP_SUMMARY
          echo "| **執行結果 (Result)** | $STATUS_ICON ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **時間 (Time)** | $BUILD_DATE |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🧪 測試與驗證 (Tests & Validation)" >> $GITHUB_STEP_SUMMARY
          echo "| 測試項目 (Test Components) | 類型 (Type) |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # Extract Test Descriptions
          # Find 'describe(' blocks, excluding imports
          grep -r "describe(" src | grep ".test.jsx" | grep -v "import" | while read -r line ; do
            # Extract text inside quotes
            RAW_DESC=$(echo "$line" | sed -E "s/.*describe\(['\"]([^'\"]+)['\"].*/\1/")
            FILE=$(echo "$line" | cut -d: -f1 | xargs basename)
            
            # Colloquial Translation Logic
            if [[ "$RAW_DESC" == *"Smoke Test"* ]]; then
               DESC_ZH="🟢 系統核心啟動檢查"
               TYPE="🛡️ 冒煙測試 (Smoke)"
            else
               DESC_ZH="🧪 $RAW_DESC"
               TYPE="整合測試 (Integration)"
            fi
            
            echo "| **$DESC_ZH** <br> <span style='color:gray;font-size:12px'>$RAW_DESC</span> | $TYPE |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 系統指標 (System Metrics)" >> $GITHUB_STEP_SUMMARY
          echo "| 指標 | 數值 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **總檔案大小 (Total Size)** | **$BUILD_SIZE** 📦 |" >> $GITHUB_STEP_SUMMARY
          echo "| **檔案數量 (File Count)** | **$FILE_COUNT** files 📄 |" >> $GITHUB_STEP_SUMMARY
