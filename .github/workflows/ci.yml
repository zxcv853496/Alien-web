name: CI Checks

# 設定觸發條件
on:
  push:
    branches: [ "develop" ] # 當推送到 develop 分支時觸發
  pull_request:
    branches: [ "main", "develop" ] # 當有人發起合併請求到 main 或 develop 時觸發

# 定義工作內容
jobs:
  check-quality:
    name: Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      # 1. 下載程式碼
      - name: Checkout Code 🗄️
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安裝依賴套件
      - name: Install Dependencies 📦
        # 使用與 deploy.yml 一致的參數，避開 React 19 相容性問題
        run: npm ci --legacy-peer-deps

      # 4. 程式碼品質檢查 (Lint)
      - name: Lint Check 🔍
        run: npm run lint

      # 5. 打包測試 (Build)
      - name: Build Check 🏗️
        run: npm run build
