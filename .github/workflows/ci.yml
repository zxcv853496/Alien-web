name: CI Checks

# 設定觸發條件
on:
  push:
    branches: [ "develop" ] # 當推送到 develop 分支時觸發
  pull_request:
    branches: [ "main", "develop" ] # 當有人發起合併請求到 main 或 develop 時觸發

# 定義工作內容
jobs:
  check-quality:
    name: Quality & Build Check
    runs-on: ubuntu-latest
    steps:
      # 1. 下載程式碼
      - name: Checkout Code 🗄️
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 安裝依賴套件
      - name: Install Dependencies 📦
        # 使用與 deploy.yml 一致的參數，避開 React 19 相容性問題
        run: npm ci --legacy-peer-deps

      # 4. 程式碼品質檢查 (Lint)
      - name: Lint Check 🔍
        run: npm run lint

      # 5. 打包測試 (Build)
      - name: Build Check 🏗️
        run: npm run build

      - name: Generate CI Summary 📋
        if: success()
        run: |
          # Calculate Metrics
          BUILD_SIZE=$(du -sh dist | cut -f1)
          FILE_COUNT=$(find dist -type f | wc -l)
          
          echo "# ✅ CI 檢查通過 (CI Passed)" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 建置數據 (Metrics)" >> $GITHUB_STEP_SUMMARY
          echo "| 指標 | 數值 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **總檔案大小 (Total Size)** | **$BUILD_SIZE** 📦 |" >> $GITHUB_STEP_SUMMARY
          echo "| **檔案數量 (File Count)** | **$FILE_COUNT** files 📄 |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🛠️ 詳細資訊 (Details)" >> $GITHUB_STEP_SUMMARY
          echo "| 項目 | 內容 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint Check** | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Check** | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
